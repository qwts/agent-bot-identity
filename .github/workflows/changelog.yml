name: Changelog fragment

# A PR adds its entry as changes/<slug>.md; only the release step edits
# CHANGELOG.md. The skip-changelog label skips the check, and labelling
# re-runs it, which is why this is not a job in ci.yml.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: changelog-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Runner variables may name a self-hosted runner. A pull request from a fork
# always gets the GitHub-hosted label instead, so outside code never reaches a
# self-hosted runner, and no job here reads a secret (#752).
jobs:
  fragment:
    name: Changelog fragment
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
      - name: Require a changes/ fragment
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: node scripts/changelog.mjs check --base "$BASE" --head "$HEAD" --labels "$LABELS"
