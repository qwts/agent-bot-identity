name: CI
run-name: CI ${{ github.event_name == 'workflow_dispatch' && format('purpose={0}', inputs.purpose) || 'lifecycle' }}

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      purpose:
        description: Why the complete suite is being run manually
        required: true
        type: choice
        options:
          - exact-sha-preflight
          - diagnostics
          - release-recovery
          - workflow-testing
          - explicit-rerun

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

# Runner variables may name a self-hosted runner. A pull request from a fork
# always gets the GitHub-hosted label instead, so outside code never reaches a
# self-hosted runner, and no job here reads a secret (#752).
jobs:
  policy:
    name: Action Policy
    # The immutable shared action rejects unauthorized actor pairs and public forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    env:
      CI_POLICY_ACTOR: ${{ github.actor }}
      CI_POLICY_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
    outputs:
      mode: ${{ steps.policy.outputs.mode }}
      run_full: ${{ steps.policy.outputs.run_full }}
      run_post_merge: ${{ steps.policy.outputs.run_post_merge }}
    steps:
      - id: policy
        uses: qwts/qwts-agent-ci/.github/actions/ci-policy@3a5617b287d922e37f262210a1d8750d8217b56d

  merge-evidence:
    name: Verify exact main evidence
    needs: policy
    if: needs.policy.outputs.run_post_merge == 'true'
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    outputs:
      validated: ${{ steps.evidence.outputs.validated }}
    steps:
      - id: evidence
        name: Find a successful complete-suite run for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100" \
            --jq 'first(.workflow_runs[] | select(.path == ".github/workflows/ci.yml" and (.event == "pull_request" or .event == "workflow_dispatch") and .conclusion == "success") | .id) // empty')
          validated=false
          if [ -n "$run_id" ]; then
            validated=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=latest&per_page=100" \
              --jq 'any(.jobs[]; .name == "CI" and .conclusion == "success")')
          fi
          echo "validated=$validated" >> "$GITHUB_OUTPUT"

  preflight-evidence:
    name: Verify exact PR-head preflight
    needs: policy
    if: github.event_name == 'pull_request' && needs.policy.outputs.run_full == 'true'
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    outputs:
      validated: ${{ steps.evidence.outputs.validated }}
    steps:
      - id: evidence
        name: Find a successful manual complete suite for the PR head
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=workflow_dispatch&head_sha=$TARGET_SHA&per_page=100" \
            --jq 'first(.workflow_runs[] | select(.path == ".github/workflows/ci.yml" and .display_title == "CI purpose=exact-sha-preflight" and .conclusion == "success") | .id) // empty')
          validated=false
          if [ -n "$run_id" ]; then
            validated=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=latest&per_page=100" \
              --jq 'any(.jobs[]; .name == "CI" and .conclusion == "success")')
          fi
          echo "validated=$validated" >> "$GITHUB_OUTPUT"

  complete:
    name: Complete suite
    needs: [policy, merge-evidence, preflight-evidence]
    if: >-
      always() && needs.policy.result == 'success' &&
      ((needs.policy.outputs.run_full == 'true' && needs.preflight-evidence.outputs.validated != 'true') ||
      (needs.policy.outputs.run_post_merge == 'true' && needs.merge-evidence.outputs.validated != 'true'))
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
      - name: Run the repository validation contract
        run: npm test

  codeql:
    name: Advanced CodeQL
    needs: [policy, merge-evidence, preflight-evidence]
    if: >-
      always() && needs.policy.result == 'success' &&
      (needs.policy.outputs.run_post_merge == 'true' ||
      (needs.policy.outputs.run_full == 'true' && needs.preflight-evidence.outputs.validated != 'true'))
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    uses: ./.github/workflows/codeql.yml

  workflow-runtime:
    name: Workflow runtime policy
    needs: policy
    if: needs.policy.result == 'success'
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Checkout exact validation commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Checkout pinned runtime checker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: qwts/qwts-agent-ci
          ref: 3a5617b287d922e37f262210a1d8750d8217b56d
          path: .ci-runtime-policy
          sparse-checkout: tools/ci-runtime
          persist-credentials: false
      - name: Enforce bounded workflow runtime
        run: node .ci-runtime-policy/tools/ci-runtime/runtime-policy.mjs --root "$GITHUB_WORKSPACE"

  skill-gate:
    name: CLI skill release gate
    # ENG-0055: the release fails closed unless the agent skill, its bundle,
    # and the packaged executable agree. Every lane runs it, so a version bump
    # that outgrows qwts-versions fails before it can be tagged.
    needs: policy
    if: needs.policy.result == 'success'
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
      - name: Package the release tree as the formula installs it
        # git archive applies export-subst, as GitHub's release archive does,
        # so RELEASE_COMMIT is stamped; the formula then drops these paths and
        # installs the remaining top-level entries into libexec.
        run: |
          set -euo pipefail
          pkg="$RUNNER_TEMP/pkg"
          mkdir -p "$pkg/src" "$pkg/libexec"
          git archive HEAD | tar -x -C "$pkg/src"
          rm -rf "$pkg/src/tests" "$pkg/src/tools" "$pkg/src/governance" "$pkg/src/Formula"
          cp -R "$pkg/src/"* "$pkg/libexec/"
      - uses: qwts/qwts-agent-ci/.github/actions/cli-skill-gate@518948bdfaa8f64a9fc5803f339fe32f8dc0c62e
        with:
          skill: skills/agent-bot
          executable: ${{ runner.temp }}/pkg/libexec/agent-bot
          bundle: ${{ runner.temp }}/pkg/libexec/skills/agent-bot
          bundle-args-json: '["skill", "path"]'
          test-json: '["node", "--test", "tests/skill-workflows.test.mjs"]'

  linux-bundle:
    name: Linux CLI bundle
    # ADR-0332 decision 1: the headless-Linux archives are a release artifact
    # per platform, so CI builds one of them here and runs its install and
    # uninstall against a fake systemctl. The build never executes a Linux
    # binary, so an arm64 runner and an x64 runner assemble the same way.
    # ADR-0332's consequences require CI to build and test each of the three
    # release artifacts, so this lane runs in every lifecycle lane, like the
    # skill gate.
    needs: policy
    if: needs.policy.result == 'success'
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.LINUX_RUNNER || 'ubuntu-latest' }}
            target: linux-x64
          - runner: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04-arm' || vars.LINUX_ARM_RUNNER || 'ubuntu-24.04-arm' }}
            target: linux-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          # The build runs the pinned agent-comms CLI to check what it dispatches,
          # so the lane runs on the Node the archive ships, not on an older one
          # the component's engines do not allow.
          node-version: 24
      - name: Build the ${{ matrix.platform.target }} archive
        env:
          TARGET: ${{ matrix.platform.target }}
        run: node scripts/linux-bundle/build.mjs --platform "$TARGET" --out dist
      - name: Verify the assembled checksum file
        run: cd dist && sha256sum --check --strict SHA256SUMS
      - name: Install and uninstall the archive against a fake systemctl
        # A real user manager is never involved and no real HOME is touched:
        # AGENT_BOT_SYSTEMCTL and AGENT_BOT_PS are injected fakes and HOME is a
        # throwaway directory, so this lane cannot start or stop anything on the
        # runner. On a runner that matches the target it also runs the installed
        # wrapper, which proves it reaches the bundled runtime.
        run: sh scripts/linux-bundle/ci-smoke.sh dist

  keyd:
    name: keyd
    # agent-bot-keyd (#767) builds and tests here unsigned. GeniusBar's release
    # job signs and notarizes the binary, so no signing secret reaches this
    # public repository. The runner is GitHub-hosted on purpose, never a repo
    # variable that could name a self-hosted runner, because pull requests from
    # outside contributors reach this lane (#752).
    needs: policy
    if: needs.policy.result == 'success'
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: keyd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # rustup reads keyd/rust-toolchain.toml, so the pinned toolchain installs here.
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Format, lint and test
        run: cargo fmt --check && cargo clippy --locked --all-targets -- -D warnings && cargo test --locked
      - name: Build the unsigned binary
        run: cargo build --release --locked

  gate:
    name: CI
    needs: [policy, merge-evidence, preflight-evidence, complete, codeql, workflow-runtime, skill-gate, linux-bundle, keyd]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Enforce the selected lifecycle lane
        env:
          MODE: ${{ needs.policy.outputs.mode }}
          POLICY: ${{ needs.policy.result }}
          COMPLETE: ${{ needs.complete.result }}
          CODEQL: ${{ needs.codeql.result }}
          WORKFLOW_RUNTIME: ${{ needs.workflow-runtime.result }}
          SKILL_GATE: ${{ needs.skill-gate.result }}
          LINUX_BUNDLE: ${{ needs.linux-bundle.result }}
          KEYD: ${{ needs.keyd.result }}
          PREFLIGHT: ${{ needs.preflight-evidence.result }}
          PREFLIGHT_VALIDATED: ${{ needs.preflight-evidence.outputs.validated }}
          MERGE_VALIDATED: ${{ needs.merge-evidence.outputs.validated }}
        run: |
          test "$POLICY" = success
          test "$WORKFLOW_RUNTIME" = success
          test "$SKILL_GATE" = success
          test "$LINUX_BUNDLE" = success
          test "$KEYD" = success
          case "$MODE" in
            full)
              if [ "$PREFLIGHT_VALIDATED" = true ]; then
                test "$PREFLIGHT" = success
              else
                test "$COMPLETE" = success
                test "$CODEQL" = success
              fi
              ;;
            manual)
              test "$COMPLETE" = success
              test "$CODEQL" = success
              ;;
            post-merge)
              test "$CODEQL" = success
              if [ "$MERGE_VALIDATED" != true ]; then
                test "$COMPLETE" = success
              fi
              ;;
            *) exit 1 ;;
          esac
