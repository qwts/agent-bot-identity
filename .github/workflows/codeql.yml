name: CodeQL

on:
  workflow_call:

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

# Runner variables may name a self-hosted runner. A pull request from a fork
# always gets the GitHub-hosted label instead, so outside code never reaches a
# self-hosted runner, and no job here reads a secret (#752).
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CODEQL_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38
        with:
          category: /language:${{ matrix.language }}
