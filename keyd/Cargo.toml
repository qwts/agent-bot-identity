[package]
name = "agent-bot-keyd"
version = "0.1.0"
description = "Holds each soul's GitHub App key in the Keychain and serves short-lived tokens over MCP (agent-bot-identity #397)"
edition = "2021"
publish = false

[[bin]]
name = "agent-bot-keyd"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ed25519-dalek = "2"
sha2 = "0.10"
hmac = "0.12"
getrandom = "0.3"
libc = "0.2"
ureq = { version = "3", default-features = false, features = ["native-tls", "json"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
security-framework-sys = "2"
core-foundation = "0.10"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSError"] }
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "block2", "LAContext", "LAError"] }
block2 = "0.6"
